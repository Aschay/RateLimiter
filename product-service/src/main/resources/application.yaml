spring:
  application:
    name: product-service

  datasource:
    url: jdbc:h2:mem:products
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  h2:
    console:
      enabled: true

server:
  port: 7070

management:
  endpoints:
    web:
      exposure:
        include: health,info